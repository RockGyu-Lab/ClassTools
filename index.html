<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ClassTools</title>
<style>
/* 지구과학 World 메인 화면과 같은 틀: 머리 띠 + 분야(도구실) 카드 목록 */
:root{color-scheme:light dark;--bg:#f3f4f8;--fg:#1b1f2a;--muted:#5a6070;--card:#fff;--line:#e3e6ee;--blue:#5468d4;--acc-bg:#eef0fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--fg:#e8eaf2;--muted:#a3a9bb;--card:#1f222c;--line:#2c3247;--blue:#8f9cf0;--acc-bg:#1e2340}}
:root[data-theme="dark"]{--bg:#14161d;--fg:#e8eaf2;--muted:#a3a9bb;--card:#1f222c;--line:#2c3247;--blue:#8f9cf0;--acc-bg:#1e2340}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;word-break:keep-all}
header{background:radial-gradient(1px 1px at 12% 30%,#dfe5ffaa,transparent),radial-gradient(1.2px 1.2px at 28% 72%,#dfe5ff77,transparent),radial-gradient(1px 1px at 64% 22%,#dfe5ff99,transparent),radial-gradient(1.3px 1.3px at 82% 64%,#dfe5ff88,transparent),radial-gradient(1px 1px at 92% 18%,#dfe5ff66,transparent),linear-gradient(135deg,#141a36,#2d3a86);color:#fff;padding:48px 20px 42px;text-align:center}
header .eyebrow{font-size:.9rem;letter-spacing:.12em;opacity:.82}
header h1{margin:8px 0;font-size:clamp(2rem,5vw,3rem)}
header p{margin:0;color:#e3e8fb}
main{max-width:1000px;margin:0 auto;padding:28px 18px 48px}
h2{font-size:1.35rem;margin:0 0 14px}
.subject-list{display:grid;gap:16px}
.subject{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid transparent;border-radius:14px;padding:22px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(20,25,45,.06),0 6px 20px rgba(20,25,45,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.subject:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 2px 6px rgba(20,25,45,.08),0 12px 28px rgba(20,25,45,.09)}
.subject:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.symbol{display:grid;place-items:center;flex:0 0 64px;width:64px;height:64px;border-radius:12px;background:var(--acc-bg);font-size:2rem}
.subject h3{margin:0 0 4px;font-size:1.2rem}
.subject h3 .cnt{color:var(--blue);font-size:.85rem;font-weight:700;margin-left:.5em}
.subject p{margin:0;color:var(--muted)}
.arrow{margin-left:auto;font-size:1.6rem;color:var(--blue);flex:0 0 auto}
.note{margin-top:22px;color:var(--muted);font-size:.9rem}
footer{text-align:center;color:var(--muted);font-size:.88rem;padding:0 18px 24px}
@media(max-width:520px){
  header{padding:38px 18px 34px}
  .subject{gap:13px;padding:17px}
  .symbol{flex-basis:52px;width:52px;height:52px;font-size:1.7rem}
  .subject h3{font-size:1.08rem}
  .subject p{font-size:.94rem}
}
</style>
<!-- 글꼴(Pretendard): 인터넷이 없으면 시스템 글꼴로 대신 표시되며 기능에는 영향 없음 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>
<header>
  <div class="eyebrow"><span style="letter-spacing:.02em">RockGyu 쌤의</span> CLASSROOM TOOLS</div>
  <h1>ClassTools</h1>
  <p>수업과 담임 업무에 쓰는 작은 도구 모음</p>
  <p>by RockGyu</p>
</header>
<main>
  <h2>분야별 도구실</h2>
  <div class="subject-list">
    <a class="subject" href="./Lesson/Lesson_index.html">
      <div class="symbol" aria-hidden="true">📚</div>
      <div>
        <h3>수업 도구<span class="cnt">도구 1개</span></h3>
        <p>수업 시간에 바로 꺼내 쓰는 뽑기·활동 도구를 모은 곳입니다.</p>
      </div>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="subject" href="./Homeroom/Homeroom_index.html">
      <div class="symbol" aria-hidden="true">🏫</div>
      <div>
        <h3>담임 업무<span class="cnt">준비 중</span></h3>
        <p>자리 배치처럼 학급을 운영할 때 쓰는 도구를 모을 곳입니다.</p>
      </div>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
  </div>
  <p class="note">학생 명단 같은 개인정보는 이 사이트에 저장되지 않습니다. 필요할 때 화면에 넣으면, 지금 쓰는 기기의 브라우저에만 남습니다.</p>
</main>
<footer>ClassTools · 수업과 담임 업무 도구 모음</footer>
<script src="./copyright.js"></script>
</body>
</html>
