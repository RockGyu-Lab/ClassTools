<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>수업 도구 | ClassTools</title>
<style>
/* 도구실 메뉴: 지구과학 World 학습실 메뉴와 같은 틀 */
:root{color-scheme:light dark;--bg:#f3f4f8;--fg:#1b1f2a;--muted:#5a6070;--card:#fff;--line:#e3e6ee;--blue:#5468d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--fg:#e8eaf2;--muted:#a3a9bb;--card:#1f222c;--line:#2c3247;--blue:#8f9cf0}}
:root[data-theme="dark"]{--bg:#14161d;--fg:#e8eaf2;--muted:#a3a9bb;--card:#1f222c;--line:#2c3247;--blue:#8f9cf0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;word-break:keep-all}
header{background:radial-gradient(1px 1px at 12% 30%,#dfe5ffaa,transparent),radial-gradient(1.2px 1.2px at 28% 72%,#dfe5ff77,transparent),radial-gradient(1px 1px at 64% 22%,#dfe5ff99,transparent),radial-gradient(1.3px 1.3px at 82% 64%,#dfe5ff88,transparent),radial-gradient(1px 1px at 92% 18%,#dfe5ff66,transparent),linear-gradient(135deg,#141a36,#2d3a86);color:#fff;padding:26px 18px}
.wrap{max-width:1000px;margin:0 auto}
.back{display:inline-block;color:#e3e8fb;text-decoration:none;margin-bottom:12px}
.back:hover{text-decoration:underline}
h1{font-size:clamp(1.8rem,4vw,2.4rem);margin:0 0 6px}
header p{margin:0;color:#e3e8fb}
main{max-width:1000px;margin:0 auto;padding:28px 18px 48px}
.intro{color:var(--muted);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid transparent;border-radius:14px;padding:22px;text-decoration:none;color:inherit;min-height:190px;box-shadow:0 1px 3px rgba(20,25,45,.06),0 6px 20px rgba(20,25,45,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 2px 6px rgba(20,25,45,.08),0 12px 28px rgba(20,25,45,.09)}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.num{font-size:.85rem;color:var(--blue);font-weight:700;letter-spacing:.04em}
.card h2{font-size:1.18rem;margin:10px 0 6px}
.card p{margin:0;color:var(--muted)}
.open{margin-top:auto;padding-top:18px;color:var(--blue);font-weight:700}
footer{text-align:center;color:var(--muted);font-size:.88rem;padding:0 18px 24px}
@media(max-width:520px){
  header{padding:24px 16px}
  .card{padding:18px;min-height:175px}
}
</style>
<!-- 글꼴(Pretendard): 인터넷이 없으면 시스템 글꼴로 대신 표시되며 기능에는 영향 없음 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>
<header>
  <div class="wrap">
    <a class="back" href="../index.html">← ClassTools</a>
    <h1>수업 도구</h1>
    <p>수업 시간에 바로 꺼내 쓰는 뽑기·활동 도구를 모은 곳입니다.</p>
  </div>
</header>
<main>
  <p class="intro">쓸 도구를 고르세요. 기록은 지금 쓰는 기기의 브라우저에만 남습니다.</p>
  <div class="cards">
    <a class="card" href="./mineral_draw.html">
      <span class="num">도구 01</span>
      <h2>광물 비즈 재료 뽑기</h2>
      <p>뒤집힌 카드 27장 가운데 하나를 고르면 광물이 무작위로 나옵니다. 한 번 나온 광물은 다시 나오지 않고, 뽑힌 순서가 기록됩니다.</p>
      <span class="open">도구 열기　→</span>
    </a>
  </div>
</main>
<footer>ClassTools · 수업 도구</footer>
<script src="../copyright.js"></script>
</body>
</html>
